<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Μνήμη &amp; Σοφία</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Μνήμη &amp; Σοφία">
<style>
  :root {
    --bg: #EDE6D6;
    --bg-soft: #E4DAC4;
    --panel: #F6F1E4;
    --ink: #2B2118;
    --ink-soft: #6B5D4C;
    --gold: #A9822F;
    --gold-strong: #8C6A22;
    --terracotta: #B5624A;
    --card-back: #D9CBA8;
    --card-back-hover: #CFBF97;
    --success: #6B7F52;
    --shadow: rgba(43, 33, 24, 0.18);
    --focus: #B5624A;
    --font-display: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
    --font-ui: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14172A;
      --bg-soft: #1B1F38;
      --panel: #1E2240;
      --ink: #F2EFE9;
      --ink-soft: #A6ADD1;
      --gold: #D4AF37;
      --gold-strong: #E8C75B;
      --terracotta: #D98B72;
      --card-back: #262B4D;
      --card-back-hover: #2F355C;
      --success: #8FAE6E;
      --shadow: rgba(0, 0, 0, 0.45);
      --focus: #D98B72;
    }
  }

  :root[data-theme="dark"] {
    --bg: #14172A;
    --bg-soft: #1B1F38;
    --panel: #1E2240;
    --ink: #F2EFE9;
    --ink-soft: #A6ADD1;
    --gold: #D4AF37;
    --gold-strong: #E8C75B;
    --terracotta: #D98B72;
    --card-back: #262B4D;
    --card-back-hover: #2F355C;
    --success: #8FAE6E;
    --shadow: rgba(0, 0, 0, 0.45);
    --focus: #D98B72;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-ui);
    min-height: 100vh;
    transition: background 0.4s ease, color 0.4s ease;
  }

  .wrap {
    max-width: 780px;
    margin: 0 auto;
    padding: 32px 20px 64px;
  }

  header.top {
    text-align: center;
    margin-bottom: 28px;
  }

  h1 {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: clamp(2.1rem, 6vw, 2.9rem);
    margin: 0 0 6px;
    letter-spacing: 0.01em;
  }

  .subtitle {
    color: var(--ink-soft);
    font-size: 1.05rem;
    max-width: 46ch;
    margin: 0 auto;
    line-height: 1.5;
  }

  /* toolbar */
  .toolbar {
    position: fixed;
    top: 16px;
    right: 16px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: flex-end;
    max-width: 280px;
    z-index: 40;
  }
  .tool-btn {
    background: var(--panel);
    border: 1px solid var(--card-back);
    color: var(--ink);
    border-radius: 999px;
    width: 42px;
    height: 42px;
    font-size: 1.1rem;
    font-family: var(--font-ui);
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 8px var(--shadow);
  }
  .tool-btn:focus-visible, button:focus-visible, input:focus-visible, .card:focus-visible {
    outline: 3px solid var(--focus);
    outline-offset: 2px;
  }

  /* mode tabs */
  .tabs {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-bottom: 22px;
    flex-wrap: wrap;
  }
  .tab-btn {
    font-family: var(--font-ui);
    font-size: 1rem;
    font-weight: 600;
    padding: 12px 22px;
    border-radius: 12px;
    border: 1.5px solid var(--card-back);
    background: var(--panel);
    color: var(--ink-soft);
    cursor: pointer;
    min-height: 46px;
    transition: border-color 0.2s ease, color 0.2s ease, background 0.2s ease;
  }
  .tab-btn[aria-selected="true"] {
    border-color: var(--gold);
    color: var(--ink);
    background: var(--bg-soft);
  }

  .panel {
    background: var(--panel);
    border-radius: 18px;
    padding: 24px;
    box-shadow: 0 6px 24px var(--shadow);
    margin-bottom: 20px;
  }

  .field-row {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
  }

  .diff-btn {
    font-family: var(--font-ui);
    font-size: 0.98rem;
    padding: 11px 18px;
    border-radius: 10px;
    border: 1.5px solid var(--card-back);
    background: var(--bg);
    color: var(--ink);
    cursor: pointer;
    min-height: 44px;
  }
  .diff-btn[aria-pressed="true"] {
    border-color: var(--terracotta);
    background: var(--terracotta);
    color: #fff;
  }

  .primary-btn {
    font-family: var(--font-ui);
    font-weight: 600;
    font-size: 1.02rem;
    padding: 13px 26px;
    border-radius: 12px;
    border: none;
    background: var(--gold-strong);
    color: #fff;
    cursor: pointer;
    min-height: 48px;
  }
  .primary-btn:disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }
  .ghost-btn {
    font-family: var(--font-ui);
    font-weight: 600;
    font-size: 0.95rem;
    padding: 11px 20px;
    border-radius: 10px;
    border: 1.5px solid var(--card-back);
    background: transparent;
    color: var(--ink);
    cursor: pointer;
    min-height: 44px;
  }

  .center { text-align: center; }
  .mt16 { margin-top: 16px; }
  .mt20 { margin-top: 20px; }

  .field-label {
    display: block;
    font-size: 0.9rem;
    font-weight: 600;
    color: var(--ink-soft);
    margin-bottom: 6px;
  }
  .text-input {
    width: 100%;
    font-family: var(--font-ui);
    font-size: 1rem;
    padding: 11px 14px;
    border-radius: 10px;
    border: 1.5px solid var(--card-back);
    background: var(--bg);
    color: var(--ink);
    margin-bottom: 14px;
  }

  /* upload */
  .dropzone {
    border: 2px dashed var(--card-back);
    border-radius: 14px;
    padding: 28px 16px;
    text-align: center;
    cursor: pointer;
    color: var(--ink-soft);
  }
  .dropzone:hover { border-color: var(--gold); }
  .thumbs {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(72px, 1fr));
    gap: 10px;
    margin-top: 16px;
  }
  .thumb {
    position: relative;
    aspect-ratio: 1;
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid var(--card-back);
  }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb button {
    position: absolute;
    top: 3px;
    right: 3px;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: none;
    background: rgba(0,0,0,0.55);
    color: #fff;
    font-size: 0.85rem;
    line-height: 1;
    cursor: pointer;
  }
  .thumb.active { border-color: var(--terracotta); border-width: 3px; }
  .symbol-chip {
    font-size: 1.6rem;
    border: 1.5px solid var(--card-back);
    border-radius: 10px;
    padding: 10px 14px;
    background: var(--bg);
    cursor: pointer;
    min-height: 44px;
  }
  .symbol-chip:hover { border-color: var(--terracotta); }
  .upload-note {
    font-size: 0.9rem;
    color: var(--ink-soft);
    margin-top: 10px;
    text-align: center;
  }

  /* named packs (photos + symbols) */
  .pack-chip {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--bg);
    border: 1.5px solid var(--card-back);
    border-radius: 10px;
    padding: 4px 4px 4px 16px;
  }
  .pack-chip.active {
    border-color: var(--terracotta);
    background: var(--terracotta);
  }
  .pack-select-btn {
    background: none;
    border: none;
    font-family: var(--font-ui);
    font-size: 1.05rem;
    font-weight: 600;
    color: var(--ink);
    cursor: pointer;
    padding: 12px 8px;
    min-height: 44px;
  }
  .pack-chip.active .pack-select-btn { color: #fff; }
  .pack-delete-btn {
    width: 40px;
    height: 40px;
    min-width: 40px;
    border-radius: 50%;
    border: none;
    background: rgba(0,0,0,0.12);
    color: var(--ink);
    cursor: pointer;
    font-size: 1.2rem;
    line-height: 1;
  }
  .pack-chip.active .pack-delete-btn { background: rgba(255,255,255,0.28); color: #fff; }
  .pack-delete-btn.marked { background: var(--terracotta); color: #fff; }
  .pack-chip.active .pack-delete-btn.marked { background: #fff; color: var(--terracotta); }

  /* music track rows */
  .track-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    background: var(--bg);
    border: 1.5px solid var(--card-back);
    border-radius: 10px;
    padding: 8px 8px 8px 14px;
    margin-top: 8px;
  }
  .track-row.active { border-color: var(--terracotta); }
  .track-name {
    background: none;
    border: none;
    font-family: var(--font-ui);
    font-size: 0.92rem;
    color: var(--ink);
    cursor: pointer;
    text-align: left;
    flex: 1;
    padding: 6px 4px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .shuffle-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-top: 14px;
  }

  /* colors panel */
  .color-grid {
    display: flex;
    flex-direction: column;
    gap: 12px;
    max-width: 360px;
    margin: 0 auto;
  }
  .color-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    font-size: 0.95rem;
  }
  .color-row input[type="color"] {
    width: 52px;
    height: 38px;
    border: 1.5px solid var(--card-back);
    border-radius: 8px;
    cursor: pointer;
    background: none;
    padding: 2px;
  }

  /* stats bar */
  .stats {
    display: flex;
    justify-content: center;
    gap: 26px;
    margin-bottom: 18px;
    flex-wrap: wrap;
  }
  .stat {
    text-align: center;
  }
  .stat .num {
    font-family: var(--font-display);
    font-size: 1.6rem;
    font-weight: 700;
    color: var(--gold-strong);
  }
  .stat .lbl {
    font-size: 0.8rem;
    color: var(--ink-soft);
  }

  /* board */
  .board {
    display: grid;
    gap: 12px;
    margin: 0 auto 20px;
  }
  .card {
    aspect-ratio: 1;
    perspective: 800px;
    cursor: pointer;
    border: none;
    background: none;
    padding: 0;
  }
  .card-inner {
    position: relative;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
    transition: transform 0.45s cubic-bezier(.4,.2,.2,1);
    border-radius: 12px;
  }
  .card.flipped .card-inner,
  .card.matched .card-inner {
    transform: rotateY(180deg);
  }
  .card-face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card-back-face {
    background: var(--card-back);
    color: var(--gold-strong);
  }
  .card:hover .card-back-face { background: var(--card-back-hover); }
  .card-front-face {
    background: var(--panel);
    transform: rotateY(180deg);
    border: 1.5px solid var(--card-back);
    overflow: hidden;
  }
  .card.matched .card-front-face {
    border-color: var(--success);
    box-shadow: 0 0 0 2px var(--success) inset;
  }
  .card-front-face.emoji-face { font-size: clamp(2.2rem, 9vw, 3.4rem); line-height: 1; }
  .card-front-face.emoji-face.word-face {
    font-size: clamp(0.8rem, 4.6vw, 1.3rem);
    line-height: 1.25;
    font-weight: 700;
    font-family: var(--font-ui);
    text-align: center;
    padding: 6px;
    overflow-wrap: break-word;
  }
  .card-front-face img { width: 100%; height: 100%; object-fit: cover; }
  .card-back-face svg { width: 30%; height: 30%; opacity: 0.6; }

  @media (prefers-reduced-motion: reduce) {
    .card-inner { transition: none; }
  }

  /* quote panel */
  .quote-box {
    min-height: 64px;
    text-align: center;
    padding: 14px 20px;
    font-family: var(--font-display);
    font-style: italic;
    font-size: 1.25rem;
    color: var(--ink-soft);
    opacity: 0;
    transition: opacity 0.6s ease;
  }
  .quote-box.show { opacity: 1; color: var(--ink); }

  /* win overlay */
  .win-overlay {
    position: fixed;
    inset: 0;
    background: rgba(20, 23, 42, 0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 50;
  }
  .win-card {
    background: var(--panel);
    border-radius: 20px;
    padding: 36px 30px;
    max-width: 420px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }
  .win-card h2 {
    font-family: var(--font-display);
    font-size: 2rem;
    margin: 0 0 10px;
  }
  .win-stats { color: var(--ink-soft); margin-bottom: 6px; }
  .best-note { color: var(--gold-strong); font-weight: 600; margin-top: 8px; }
  .win-quote {
    font-weight: 700;
    font-style: italic;
    margin-top: 16px;
    color: var(--ink);
    font-family: var(--font-display);
    font-size: 1.2rem;
    line-height: 1.4;
  }
  .win-actions { display: flex; gap: 10px; justify-content: center; margin-top: 22px; flex-wrap: wrap; }

  .settings-card { max-width: 640px; max-height: 85vh; overflow-y: auto; text-align: left; }
  .settings-card .panel { margin-bottom: 16px; }
  .settings-menu-btn {
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    text-align: left;
    font-family: var(--font-ui);
    font-size: 1.1rem;
    font-weight: 600;
    padding: 18px 20px;
    border-radius: 14px;
    border: 1.5px solid var(--card-back);
    background: var(--bg);
    color: var(--ink);
    cursor: pointer;
    margin-bottom: 12px;
  }
  .settings-menu-btn:hover { border-color: var(--gold); }
  .settings-menu-btn .emoji { font-size: 1.6rem; }

  .confetti-piece {
    position: fixed;
    top: -40px;
    font-size: 1.8rem;
    pointer-events: none;
    z-index: 60;
    animation: confettiFall linear forwards;
  }
  @keyframes confettiFall {
    to { transform: translateY(110vh) rotate(360deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    .confetti-piece { animation: none; display: none; }
  }

  .hidden { display: none !important; }
  .sr-only {
    position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip: rect(0,0,0,0); white-space: nowrap;
  }

  /* focused play mode: hide everything except the board while playing */
  body.playing .top,
  body.playing .tabs,
  body.playing #setupClassic,
  body.playing #setupPhotos,
  body.playing #setupPuzzle {
    display: none !important;
  }
  body.playing .wrap { max-width: 960px; padding-top: 60px; }

  .puzzle-tile {
    aspect-ratio: 1;
    border: none;
    cursor: pointer;
    background-color: var(--card-back);
    background-repeat: no-repeat;
    border-radius: 4px;
    outline-offset: 2px;
  }
  .puzzle-tile.selected {
    outline: 4px solid var(--terracotta);
    outline-offset: -2px;
  }
  .puzzle-tile.solved-flash {
    outline: 4px solid var(--success);
    outline-offset: -2px;
  }

  /* pagination */
  .pager-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    margin-top: 14px;
  }
  .pager-row.hidden { display: none !important; }
  .pager-btn {
    font-family: var(--font-ui);
    font-weight: 700;
    font-size: 1.1rem;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 1.5px solid var(--card-back);
    background: var(--bg);
    color: var(--ink);
    cursor: pointer;
  }
  .pager-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .pager-label {
    font-size: 0.95rem;
    font-weight: 600;
    color: var(--ink-soft);
    min-width: 96px;
    text-align: center;
  }

  /* size slider (puzzle difficulty) */
  .slider-wrap {
    max-width: 420px;
    margin: 0 auto;
    text-align: center;
  }
  .size-slider {
    width: 100%;
    height: 40px;
    cursor: pointer;
    accent-color: var(--terracotta);
  }
  .slider-value {
    margin-top: 6px;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 1.6rem;
    color: var(--gold-strong);
  }

  /* collapsed step summary (puzzle setup: pack/photo chosen) */
  .step-summary {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
    margin: 14px 0;
    padding: 10px 14px;
    background: var(--bg-soft);
    border-radius: 12px;
  }
  .step-summary-text {
    font-weight: 600;
    color: var(--ink);
    font-size: 0.95rem;
  }
  .step-summary-thumb {
    width: 44px;
    height: 44px;
    object-fit: cover;
    border-radius: 8px;
    border: 2px solid var(--card-back);
  }
  .link-btn {
    font-family: var(--font-ui);
    font-size: 0.9rem;
    font-weight: 700;
    color: var(--terracotta);
    background: none;
    border: none;
    text-decoration: underline;
    cursor: pointer;
    padding: 4px;
  }

  /* help overlay menu */
  .help-card { max-width: 520px; }
  .help-menu {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin-bottom: 16px;
  }
  .help-menu-btn {
    font-family: var(--font-ui);
    font-size: 0.88rem;
    font-weight: 600;
    padding: 9px 14px;
    border-radius: 10px;
    border: 1.5px solid var(--card-back);
    background: var(--bg);
    color: var(--ink-soft);
    cursor: pointer;
  }
  .help-menu-btn[aria-pressed="true"] {
    border-color: var(--gold);
    background: var(--bg-soft);
    color: var(--ink);
  }

  /* draggable win card */
  #winCard {
    cursor: grab;
    touch-action: none;
    user-select: none;
  }
  .win-overlay.reveal-board {
    background: transparent;
  }

  /* Tower of Hanoi */
  .hanoi-board {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin: 10px auto 20px;
    max-width: 620px;
    padding: 0 8px;
  }
  .hanoi-pegs {
    display: flex;
    justify-content: center;
    align-items: flex-end;
    gap: 5vw;
    width: 100%;
    position: relative;
    z-index: 1;
  }
  .hanoi-peg {
    position: relative;
    flex: 1 1 0;
    max-width: 200px;
    display: flex;
    flex-direction: column-reverse;
    align-items: center;
    justify-content: flex-start;
    height: var(--hanoi-h, 220px);
    cursor: pointer;
    border-radius: 10px 10px 0 0;
  }
  .hanoi-peg::before {
    content: "";
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 14px;
    height: 100%;
    background: var(--card-back);
    border-radius: 7px 7px 0 0;
    z-index: 0;
  }
  .hanoi-peg.selected {
    background: rgba(196, 140, 60, 0.14);
  }
  .hanoi-peg.selected::before {
    background: var(--terracotta);
  }
  .hanoi-base {
    width: 100%;
    max-width: 600px;
    height: 26px;
    margin-top: -1px;
    background: var(--card-back);
    border-radius: 13px;
    box-shadow: 0 4px 8px var(--shadow);
    position: relative;
    z-index: 2;
  }
  .hanoi-disc {
    position: relative;
    z-index: 1;
    box-sizing: border-box;
    height: var(--disc-h, 26px);
    width: var(--disc-w, 80%);
    max-width: 100%;
    border-radius: 999px;
    margin-bottom: 3px;
    border: 2px solid rgba(0, 0, 0, 0.15);
    box-shadow: 0 2px 4px var(--shadow);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;

    function onDown(e) {
      if (e.target.closest && e.target.closest('button')) return;

      el.style.transform = 'translate(' + offsetX + 'px,' + offsetY + 'px)';
      if (e.cancelable) e.preventDefault();
    }
    function onUp() { dragging = false; el.style.cursor = 'grab'; }
    el.addEventListener('mousedown', onDown);
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onUp);
    el.addEventListener('touchstart', onDown, { passive: false });
    window.addEventListener('touchmove', onMove, { passive: false });
    window.addEventListener('touchend', onUp);

  /* =========================================================
     RESPONSIVE BOARD SIZING
     Shrinks the little squares (cards/tiles) so the whole game —
     stats, board and the bottom buttons — fits on one screen,
     on any phone, at any difficulty.
  ========================================================= */
  function debounce(fn, wait) {
    var timer = null;
    return function () {
      var args = arguments;
      clearTimeout(timer);
      timer = setTimeout(function () { fn.apply(null, args); }, wait);
    };
  }
  function fitBoardToScreen(boardEl, cols, rows, gapPx, reserveEls, maxCell, minCell) {
    var vh = window.innerHeight;
    var vw = window.innerWidth;
    var reserved = 0;
    reserveEls.forEach(function (el) { if (el) reserved += el.getBoundingClientRect().height; });
    var wrapEl = document.querySelector('.wrap');
    if (wrapEl) {
      var cs = getComputedStyle(wrapEl);
      reserved += parseFloat(cs.paddingTop || 0) + parseFloat(cs.paddingBottom || 0);
    }
    var availH = Math.max(150, vh - reserved - 30);
    var availW = vw * 0.94;
    var cellFromW = (availW - gapPx * (cols - 1)) / cols;
    var cellFromH = (availH - gapPx * (rows - 1)) / rows;
    var cell = Math.max(minCell || 16, Math.min(cellFromW, cellFromH, maxCell || 130));
    var width = cell * cols + gapPx * (cols - 1);
    boardEl.style.width = width + 'px';
    boardEl.style.maxWidth = width + 'px';
    return width;
  }

  window.addEventListener('resize', debounce(function () {
    if (activeBoardResize) activeBoardResize();
  }, 150));

  /* =========================================================
     PAGINATION HELPER
     Keeps long lists (many photo packs, many photos) from
     pushing the "start game" button off the screen — shown a
     handful at a time with "Page X of Y" instead.
  ========================================================= */
  function createPager(containerEl, pagerEl, pageSize) {
    var state = { page: 0, items: [], renderItem: null };
    function totalPages() { return Math.max(1, Math.ceil(state.items.length / pageSize)); }
    function renderPager() {
      pagerEl.innerHTML = '';
      var tp = totalPages();
      if (state.items.length <= pageSize) { pagerEl.classList.add('hidden'); return; }
      pagerEl.classList.remove('hidden');
      var prev = document.createElement('button');
      prev.type = 'button'; prev.className = 'pager-btn'; prev.textContent = '‹';
      prev.setAttribute('aria-label', t('pagerPrevAria'));
      prev.disabled = state.page === 0;
      prev.addEventListener('click', function () { state.page--; renderPage(); });
      var label = document.createElement('div');
      label.className = 'pager-label';
      label.textContent = t('pagerLabel', { page: state.page + 1, total: tp });
      var next = document.createElement('button');
      next.type = 'button'; next.className = 'pager-btn'; next.textContent = '›';
      next.setAttribute('aria-label', t('pagerNextAria'));
      next.disabled = state.page >= tp - 1;
      next.addEventListener('click', function () { state.page++; renderPage(); });
      pagerEl.appendChild(prev); pagerEl.appendChild(label); pagerEl.appendChild(next);
    }
    function renderPage() {
      var tp = totalPages();
      if (state.page >= tp) state.page = tp - 1;
      if (state.page < 0) state.page = 0;
      containerEl.innerHTML = '';
      var start = state.page * pageSize;
      state.items.slice(start, start + pageSize).forEach(function (item) {
        containerEl.appendChild(state.renderItem(item));
      });
      renderPager();
    }
    return {
      setItems: function (items, renderItem, keepPage) {
        state.items = items;
        state.renderItem = renderItem;
        if (!keepPage) state.page = 0;
        renderPage();
      },
      refresh: renderPage
    };
  }

  function getAudioCtx() {
    if (!audioCtx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC) {
        audioCtx = new AC();
        masterCompressor = audioCtx.createDynamicsCompressor();
        masterCompressor.threshold.value = -18;
        masterCompressor.knee.value = 24;
        masterCompressor.ratio.value = 8;
        masterCompressor.attack.value = 0.002;
        masterCompressor.release.value = 0.15;
        masterCompressor.connect(audioCtx.destination);
      }
    }
    return audioCtx;
  }
  function playTone(freq, duration, startOffset, gainPeak) {
    if (!soundOn) return;
    try {
      var ctx = getAudioCtx();
      if (!ctx) return;
      if (ctx.state === 'suspended') ctx.resume();
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      var t0 = ctx.currentTime + (startOffset || 0);
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.linearRampToValueAtTime(gainPeak || 0.1, t0 + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
      osc.connect(gain);
      gain.connect(masterCompressor);
      osc.start(t0);
      osc.stop(t0 + duration + 0.05);
    } catch (e) {}
  }

  /* =========================================================
     INDEXEDDB (photos + music)
  ========================================================= */
  var DB_NAME = 'mwPhotosDB';
  var DB_VERSION = 3;
  var dbPromise = null;
  var dbAvailable = !!window.indexedDB;

  function openDB() {
    if (!dbAvailable) return Promise.reject(new Error('no-indexeddb'));
    if (dbPromise) return dbPromise;
    dbPromise = new Promise(function (resolve, reject) {
      var req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = function (e) {
        var db = e.target.result;
        if (!db.objectStoreNames.contains('photos')) {
          var store = db.createObjectStore('photos', { keyPath: 'id', autoIncrement: true });
          store.createIndex('packName', 'packName', { unique: false });
        }
        if (!db.objectStoreNames.contains('music')) {
          db.createObjectStore('music', { keyPath: 'id', autoIncrement: true });
        }
        if (!db.objectStoreNames.contains('sfx')) {
          db.createObjectStore('sfx', { keyPath: 'name' });
        }
      };
      req.onsuccess = function (e) { resolve(e.target.result); };
      req.onerror = function () { reject(req.error); };
    });
    return dbPromise;
  }
  function addPhotosToPack(packName, files) {
    return openDB().then(function (db) {
      return new Promise(function (resolve, reject) {
        var tx = db.transaction('photos', 'readwrite');
        var store = tx.objectStore('photos');
        files.forEach(function (file) { store.add({ packName: packName, blob: file, addedAt: Date.now() }); });
        tx.oncomplete = function () { resolve(); };
        tx.onerror = function () { reject(tx.error); };
      });
    });
  }
  function getAllPhotoRecords() {
    return openDB().then(function (db) {
      return new Promise(function (resolve, reject) {

  /* =========================================================
     IMAGE RESIZE (performance: phone photos can be 10+ MB;
     we shrink them before storing/displaying so the picker,
     the game board and IndexedDB all stay fast on phones)
  ========================================================= */
  var PHOTO_MAX_DIM = 1000;
  var PHOTO_JPEG_QUALITY = 0.82;
  var PHOTO_SKIP_BELOW_BYTES = 350000; // already small: don't bother re-encoding

  function resizeImageFile(file, maxDim, quality) {
    return new Promise(function (resolve) {
      function exportFrom(sourceImg, w, h) {
        var scale = Math.min(1, maxDim / Math.max(w, h));
        if (scale >= 1 && file.size <= PHOTO_SKIP_BELOW_BYTES) { resolve(file); return; }
        var outW = Math.max(1, Math.round(w * scale));
        var outH = Math.max(1, Math.round(h * scale));
        var canvas = document.createElement('canvas');
        canvas.width = outW; canvas.height = outH;
        var ctx = canvas.getContext('2d');
        ctx.drawImage(sourceImg, 0, 0, outW, outH);
        canvas.toBlob(function (blob) { resolve(blob || file); }, 'image/jpeg', quality);
      }
      function viaImageElement() {
        var url = URL.createObjectURL(file);
        var img = new Image();
        img.onload = function () { exportFrom(img, img.naturalWidth, img.naturalHeight); URL.revokeObjectURL(url); };
        img.onerror = function () { URL.revokeObjectURL(url); resolve(file); };
        img.src = url;
      }
      if (window.createImageBitmap) {
        createImageBitmap(file, { imageOrientation: 'from-image' }).then(function (bmp) {
          exportFrom(bmp, bmp.width, bmp.height);
          if (bmp.close) bmp.close();
        }).catch(viaImageElement);
      } else {
        viaImageElement();
      }
    });
  }

  var IMAGE_EXT_RE = /\.(jpe?g|png|gif|webp|heic|heif|bmp|tiff?|avif|jfif)$/i;
  function looksLikeImage(f) { return f.type.indexOf('image/') === 0 || IMAGE_EXT_RE.test(f.name || ''); }
  fileInput.addEventListener('change', function (e) {
    var files = Array.prototype.slice.call(e.target.files || []);
    var room = Math.max(0, MAX_BATCH - pendingFiles.length);
    var accepted = files.filter(looksLikeImage).slice(0, room);

      fileInput.value = '';
      return;
    }
    fileInput.disabled = true;
    addToPackBtn.disabled = true;
    uploadNote.textContent = t('processingPhotos', { n: accepted.length });
    Promise.all(accepted.map(function (f) {
      return resizeImageFile(f, PHOTO_MAX_DIM, PHOTO_JPEG_QUALITY).then(function (blob) {
        return { file: blob, url: URL.createObjectURL(blob) };
      });

      var chain = Promise.resolve();
      all.forEach(function (rec) {
        chain = chain.then(function () {

  function segmentGraphemes(str) {
    if (typeof Intl !== 'undefined' && Intl.Segmenter) {
      try {
        var seg = new Intl.Segmenter(undefined, { granularity: 'grapheme' });
        var out = [];
        var iter = seg.segment(str)[Symbol.iterator]();
        var r = iter.next();
        while (!r.done) { out.push(r.value.segment); r = iter.next(); }
        return out;
      } catch (e) { return Array.from(str); }
    }
    return Array.from(str);
  }
  function escapeHtml(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  // For long words on memory cards: instead of letting the browser wrap
  // wherever it runs out of room (which can strand a single orphan letter

      shuffle(order);
    } while (isPuzzleSolved(order));
    puzzleTiles = order;

    setupClassic.classList.add('hidden');
    setupPhotos.classList.add('hidden');
    setupPuzzle.classList.add('hidden');
    document.getElementById('puzzleGameArea').classList.remove('hidden');
    document.body.classList.add('playing');

    puzzleBoardEl.style.gridTemplateColumns = 'repeat(' + PUZZLE_SIZE + ', 1fr)';
    fitPuzzleBoard();
    renderPuzzleBoard();
    activeBoardResize = fitPuzzleBoard;
  }

  function renderPuzzleBoard() {
    puzzleBoardEl.innerHTML = '';
    puzzleTiles.forEach(function (pieceIdx, slotIdx) {
      var row = Math.floor(pieceIdx / PUZZLE_SIZE);
      var col = pieceIdx % PUZZLE_SIZE;
      var btn = document.createElement('button');
      btn.className = 'puzzle-tile' + (slotIdx === puzzleSelectedTile ? ' selected' : '');
      btn.style.position = 'relative';
      btn.style.overflow = 'hidden';
      btn.style.padding = '0';
      var img = document.createElement('img');
      img.src = puzzleImgURL;
      img.alt = '';
      img.style.position = 'absolute';
      img.style.width = (PUZZLE_SIZE * 100) + '%';
      img.style.height = (PUZZLE_SIZE * 100) + '%';
      img.style.maxWidth = 'none';
      img.style.left = (-col * 100) + '%';
      img.style.top = (-row * 100) + '%';
      btn.appendChild(img);
      btn.addEventListener('click', function () { onPuzzleTileClick(slotIdx); });
      puzzleBoardEl.appendChild(btn);
    });
  }

  function isPuzzleSolved(arr) {
    for (var i = 0; i < arr.length; i++) if (arr[i] !== i) return false;
    return true;
  }

  function onPuzzleTileClick(slotIdx) {
    if (puzzleSelectedTile === null) {
      puzzleSelectedTile = slotIdx;
      renderPuzzleBoard();
      return;
    }
    if (puzzleSelectedTile === slotIdx) {
      puzzleSelectedTile = null;
      renderPuzzleBoard();
      return;
    }
    var tmp = puzzleTiles[puzzleSelectedTile];
    puzzleTiles[puzzleSelectedTile] = puzzleTiles[slotIdx];
    puzzleTiles[slotIdx] = tmp;
    puzzleMoves++;
    puzzleMovesEl.textContent = puzzleMoves;
    puzzleSelectedTile = null;
    playFlipSound();
    renderPuzzleBoard();
    if (isPuzzleSolved(puzzleTiles)) {
      playMatchSound();
      setTimeout(function () { winPuzzle(); }, 350);
    }
  }

  function winPuzzle() {
    var winOverlay = document.getElementById('winOverlay');
    var winStatsText = document.getElementById('winStatsText');
    var bestNote = document.getElementById('bestNote');
    var winQuote = document.getElementById('winQuote');
    winStatsText.textContent = t('winStatsTemplate', { moves: puzzleMoves });
    bestNote.classList.add('hidden');
    var q = nextQuote();
    winQuote.textContent = '"' + q + '"';
    winQuote.classList.remove('hidden');
    winOverlay.classList.add('reveal-board');
    resetWinCardPosition();
    winOverlay.classList.remove('hidden');
    celebrate();
  }

  document.getElementById('resetPuzzleBtn').addEventListener('click', function () {
    var total = PUZZLE_SIZE * PUZZLE_SIZE;
    puzzleTiles = [];
    for (var i = 0; i < total; i++) puzzleTiles.push(i);
    puzzleSelectedTile = null;
    renderPuzzleBoard();
    /* Solved automatically at the player's request — quietly show the
       finished picture, with no "well done" message or celebration. */
  });

  document.getElementById('backToMenuBtnPuzzle').addEventListener('click', function () {
    document.getElementById('puzzleGameArea').classList.add('hidden');
    showSetup('puzzle');
  });

  /* =========================================================
     TOWER OF HANOI
  ========================================================= */
  var HANOI_DISC_OPTIONS = [3, 4, 5, 6, 7, 8];
  var HANOI_COLORS = ['#219653', '#C9A227', '#FFD400', '#8E1B3C', '#FFFFFF', '#8B5E3C', '#E63946', '#1E6FEB', '#9B30C9'];
  var hanoiSelectedDiscs = 3;
  var hanoiDiscCount = 3;
  var hanoiPegs = [[], [], []];
  var hanoiSelectedPeg = null;
  var hanoiMoves = 0;
  var hanoiDiscButtonsEl = document.getElementById('hanoiDiscButtons');
  var hanoiBoardEl = document.getElementById('hanoiBoard');
  var hanoiMovesEl = document.getElementById('hanoiMoves');
  var hanoiMinMovesEl = document.getElementById('hanoiMinMoves');
  var hanoiStatsBarEl = document.getElementById('hanoiStatsBar');
  var hanoiBottomRowEl = document.getElementById('hanoiBottomRow');

  function discColor(size) { return HANOI_COLORS[(size - 1) % HANOI_COLORS.length]; }

  function renderHanoiDiscButtons() {
    hanoiDiscButtonsEl.innerHTML = '';
    HANOI_DISC_OPTIONS.forEach(function (n) {
      var b = document.createElement('button');
      b.className = 'diff-btn';
      b.textContent = t('hanoiDiscsCountLabel', { n: n });
      b.setAttribute('aria-pressed', n === hanoiSelectedDiscs ? 'true' : 'false');
      b.addEventListener('click', function () {
        hanoiSelectedDiscs = n;
        Array.prototype.forEach.call(hanoiDiscButtonsEl.children, function (c) { c.setAttribute('aria-pressed', 'false'); });
        b.setAttribute('aria-pressed', 'true');
      });
      hanoiDiscButtonsEl.appendChild(b);
    });
  }
  renderHanoiDiscButtons();
  document.getElementById('startHanoiBtn').addEventListener('click', function () {
    startHanoiGame(hanoiSelectedDiscs);
  });

  function fitHanoiBoard() {
    var reserved = 0;
    [hanoiStatsBarEl, hanoiBottomRowEl].forEach(function (el) { if (el) reserved += el.getBoundingClientRect().height; });
    var wrapEl = document.querySelector('.wrap');
    if (wrapEl) {
      var cs = getComputedStyle(wrapEl);
      reserved += parseFloat(cs.paddingTop || 0) + parseFloat(cs.paddingBottom || 0);
    }
    reserved += 30; // the connected base plank underneath the pegs
    var availH = Math.max(140, window.innerHeight - reserved - 60);
    var pegHeight = Math.max(90, Math.min(260, availH));
    var discH = Math.max(12, Math.min(30, Math.floor((pegHeight - 14) / hanoiDiscCount) - 4));
    hanoiBoardEl.style.setProperty('--hanoi-h', pegHeight + 'px');
    hanoiBoardEl.style.setProperty('--disc-h', discH + 'px');
  }

  function renderHanoiBoard() {
    hanoiBoardEl.innerHTML = '';
    var pegsWrap = document.createElement('div');
    pegsWrap.className = 'hanoi-pegs';
    hanoiPegs.forEach(function (stack, pegIdx) {
      var peg = document.createElement('div');
      peg.className = 'hanoi-peg' + (pegIdx === hanoiSelectedPeg ? ' selected' : '');
      peg.setAttribute('role', 'button');
      peg.setAttribute('aria-label', t('hanoiPegAria', { n: pegIdx + 1 }));
      peg.addEventListener('click', function () { onHanoiPegClick(pegIdx); });
      stack.forEach(function (discSize) {
        var d = document.createElement('div');
        d.className = 'hanoi-disc';
        var widthPct = 28 + (discSize / hanoiDiscCount) * 67;
        d.style.setProperty('--disc-w', widthPct + '%');
        d.style.background = discColor(discSize);
        d.textContent = discSize;
        peg.appendChild(d);
      });
      pegsWrap.appendChild(peg);
    });
    hanoiBoardEl.appendChild(pegsWrap);
    var base = document.createElement('div');
    base.className = 'hanoi-base';
    hanoiBoardEl.appendChild(base);
  }

  function onHanoiPegClick(pegIdx) {
    if (hanoiSelectedPeg === null) {
      if (hanoiPegs[pegIdx].length === 0) return;
      hanoiSelectedPeg = pegIdx;
      renderHanoiBoard();
      return;
    }
    if (hanoiSelectedPeg === pegIdx) {
      hanoiSelectedPeg = null;
      renderHanoiBoard();
      return;
    }
    var fromStack = hanoiPegs[hanoiSelectedPeg];
    var toStack = hanoiPegs[pegIdx];
    var moving = fromStack[fromStack.length - 1];
    var topDest = toStack[toStack.length - 1];
    hanoiSelectedPeg = null;
    if (topDest !== undefined && topDest < moving) {
      playMismatchSound();
      renderHanoiBoard();
      return;
    }
    fromStack.pop();
    toStack.push(moving);
    hanoiMoves++;
    hanoiMovesEl.textContent = hanoiMoves;
    playFlipSound();
    renderHanoiBoard();
    if (hanoiPegs[hanoiPegs.length - 1].length === hanoiDiscCount) {
      playMatchSound();
      setTimeout(function () { winHanoi(); }, 350);
    }
  }

  function winHanoi() {
    var winOverlay = document.getElementById('winOverlay');
    var winStatsText = document.getElementById('winStatsText');
    var bestNote = document.getElementById('bestNote');
    var winQuote = document.getElementById('winQuote');
    winStatsText.textContent = t('winStatsTemplate', { moves: hanoiMoves });
    var improved = saveBestIfBetter('hanoi_' + hanoiDiscCount, hanoiMoves);
    if (improved) { bestNote.textContent = t('bestNoteLabel'); bestNote.classList.remove('hidden'); }
    else bestNote.classList.add('hidden');
    var q = nextQuote();
    winQuote.textContent = '"' + q + '"';
    winQuote.classList.remove('hidden');
    winOverlay.classList.remove('reveal-board');
    resetWinCardPosition();
    winOverlay.classList.remove('hidden');
    celebrate();
  }

  function startHanoiGame(n) {
    hanoiDiscCount = n;
    hanoiPegs = [[], [], []];
    for (var i = n; i >= 1; i--) hanoiPegs[0].push(i);
    hanoiSelectedPeg = null;
    hanoiMoves = 0;
    hanoiMovesEl.textContent = '0';
    hanoiMinMovesEl.textContent = String(Math.pow(2, n) - 1);

    setupClassic.classList.add('hidden');
    setupPhotos.classList.add('hidden');
    setupPuzzle.classList.add('hidden');
    setupHanoi.classList.add('hidden');
    document.getElementById('hanoiGameArea').classList.remove('hidden');
    document.body.classList.add('playing');

    fitHanoiBoard();
    renderHanoiBoard();
    activeBoardResize = fitHanoiBoard;
  }

  document.getElementById('resetHanoiBtn').addEventListener('click', function () {
    startHanoiGame(hanoiDiscCount);
  });
  document.getElementById('backToMenuBtnHanoi').addEventListener('click', function () {
    document.getElementById('hanoiGameArea').classList.add('hidden');
    showSetup('hanoi');
  });

  /* =========================================================
     GAME STATE
  ========================================================= */
  var boardEl = document.getElementById('board');
  var gameArea = document.getElementById('gameArea');
  var statMoves = document.getElementById('statMoves');
  var statPairs = document.getElementById('statPairs');
  var quoteBox = document.getElementById('quoteBox');
  var classicStatsBarEl = document.getElementById('classicStatsBar');
  var classicBottomRowEl = document.getElementById('classicBottomRow');

  var cards = [];
  var flipped = [];
  var matchedCount = 0;
  var totalPairs = 0;
  var moves = 0;
  var lockBoard = false;
  var activeDiffKey = null;

  function shuffle(arr) {
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
    }
    return arr;
  }
  function chooseCols(totalCards) {
    var target = Math.sqrt(totalCards);
    var perfect = [];
    var okImperfect = [];
    for (var c = 3; c <= 8; c++) {
      var rem = totalCards % c;
      if (rem === 1 && totalCards > c) continue;
      if (rem === 0) perfect.push(c); else okImperfect.push(c);
    }
    var pool = perfect.length ? perfect : okImperfect;
    if (pool.length === 0) return 4;
    var best = pool[0], bestDiff = Math.abs(pool[0] - target);
    pool.forEach(function (c) { var d = Math.abs(c - target); if (d < bestDiff) { bestDiff = d; best = c; } });
    return best;
  }
  function buildBoard(items, diffKey) {
    activeDiffKey = diffKey;
    totalPairs = items.length;
    matchedCount = 0; moves = 0; flipped = []; lockBoard = false; lastQuoteText = '';
    statMoves.textContent = '0';
    statPairs.textContent = '0/' + totalPairs;
    quoteBox.classList.remove('show'); quoteBox.textContent = '';

    var deck = [];
    items.forEach(function (item, i) {
      deck.push({ pairId: i, type: item.type, content: item.content });
      deck.push({ pairId: i, type: item.type, content: item.content });
    });
    shuffle(deck);
    cards = deck.map(function (c) { return Object.assign({ matched: false }, c); });

    var cols = chooseCols(cards.length);
    var rows = Math.ceil(cards.length / cols);

    gameArea.classList.remove('hidden');
    document.body.classList.add('playing');

    boardEl.style.gridTemplateColumns = 'repeat(' + cols + ', 1fr)';
    function fitClassicBoard() {
      fitBoardToScreen(boardEl, cols, rows, 12,
        [classicStatsBarEl, quoteBox, classicBottomRowEl], 120, 50);
    }
    fitClassicBoard();
    activeBoardResize = fitClassicBoard;

    boardEl.innerHTML = '';
    cards.forEach(function (c, idx) {
      var btn = document.createElement('button');
      btn.className = 'card';
      btn.setAttribute('aria-label', t('cardAria', { n: idx + 1 }));
      var isWord = c.type === 'icon' && segmentGraphemes(c.content).length > 2;
      var frontClass = c.type === 'icon' ? ('card-front-face emoji-face' + (isWord ? ' word-face' : '')) : 'card-front-face';
      var frontContent = c.type === 'icon' ? (isWord ? renderWordCardContent(c.content) : escapeHtml(c.content)) : '<img src="' + c.content + '" alt="">';
      btn.innerHTML =
        '<div class="card-inner">' +
          '<div class="card-face card-back-face"><svg viewBox="0 0 64 64" stroke="currentColor" stroke-width="3" fill="none" stroke-linecap="round"><circle cx="32" cy="32" r="20"/></svg></div>' +
          '<div class="card-face ' + frontClass + '">' + frontContent + '</div>' +
        '</div>';
      btn.addEventListener('click', function () { onCardClick(idx, btn); });
      boardEl.appendChild(btn);
    });
  }

  function onCardClick(idx, el) {
    if (lockBoard) return;
    var c = cards[idx];
    if (c.matched || el.classList.contains('flipped')) return;
    if (flipped.length === 2) return;

    playFlipSound();
    el.classList.add('flipped');
    flipped.push({ idx: idx, el: el });

    if (flipped.length === 2) {
      moves++; statMoves.textContent = moves;
      var a = flipped[0], b = flipped[1];
      if (cards[a.idx].pairId === cards[b.idx].pairId) {
        cards[a.idx].matched = true; cards[b.idx].matched = true;
        a.el.classList.add('matched'); b.el.classList.add('matched');
        matchedCount++;
        statPairs.textContent = matchedCount + '/' + totalPairs;
        flipped = [];
        playMatchSound();
        showQuote();
        if (matchedCount === totalPairs) { setTimeout(winGame, 500); }
      } else {
        lockBoard = true;
        setTimeout(function () {
          playMismatchSound();
          a.el.classList.remove('flipped'); b.el.classList.remove('flipped');
          flipped = []; lockBoard = false;
        }, 900);
      }
    }
  }

  function showQuote() {
    quoteBox.classList.remove('show');
    var q = nextQuote();
    lastQuoteText = q;
    setTimeout(function () { quoteBox.textContent = '"' + q + '"'; quoteBox.classList.add('show'); }, 120);
  }

  function bestKey(diffKey) { return 'mw_best_' + diffKey; }
  function loadBest(diffKey) {
    try { var raw = localStorage.getItem(bestKey(diffKey)); return raw ? JSON.parse(raw) : null; } catch (e) { return null; }
  }
  function saveBestIfBetter(diffKey, m) {
    if (!diffKey) return null;
    var best = loadBest(diffKey);
    var isBetter = !best || m < best.moves;
    if (isBetter) { try { localStorage.setItem(bestKey(diffKey), JSON.stringify({ moves: m })); } catch (e) {} }
    return isBetter;
  }

  function celebrate() {
    var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduceMotion) return;
    var pieces = ['🎉', '✨', '⭐', '🌟', '🎊'];
    for (var i = 0; i < 22; i++) {
      (function () {
        var span = document.createElement('span');
        span.className = 'confetti-piece';
        span.textContent = pieces[Math.floor(Math.random() * pieces.length)];
        span.style.left = Math.random() * 100 + 'vw';
        var duration = 1.8 + Math.random() * 1.4;
        span.style.animationDuration = duration + 's';
        span.style.animationDelay = (Math.random() * 0.4) + 's';
        document.body.appendChild(span);
        setTimeout(function () { span.remove(); }, (duration + 0.5) * 1000);
      })();
    }
  }

  function winGame() {
    var winOverlay = document.getElementById('winOverlay');
    var winStatsText = document.getElementById('winStatsText');
    var bestNote = document.getElementById('bestNote');
    var winQuote = document.getElementById('winQuote');
    winStatsText.textContent = t('winStatsTemplate', { moves: moves });
    var improved = saveBestIfBetter(activeDiffKey, moves);
    if (activeDiffKey && improved) { bestNote.textContent = t('bestNoteLabel'); bestNote.classList.remove('hidden'); }
    else bestNote.classList.add('hidden');
    if (lastQuoteText) { winQuote.textContent = '"' + lastQuoteText + '"'; winQuote.classList.remove('hidden'); }
    else winQuote.classList.add('hidden');
    winOverlay.classList.remove('reveal-board');
    resetWinCardPosition();
    winOverlay.classList.remove('hidden');
    celebrate();
  }

  document.getElementById('playAgainBtn').addEventListener('click', function () {
    document.getElementById('winOverlay').classList.add('hidden');
    if (currentMode === 'classic') startClassicGame();
    else if (currentMode === 'photos') startPhotosGame();
    else if (currentMode === 'puzzle') startPuzzleGame(puzzleImgURL);
    else if (currentMode === 'hanoi') startHanoiGame(hanoiDiscCount);
  });
  document.getElementById('changeModeBtn').addEventListener('click', function () {
    document.getElementById('winOverlay').classList.add('hidden');
    showSetup(currentMode);
  });
  document.getElementById('backToMenuBtn').addEventListener('click', function () { showSetup(currentMode); });

  function startClassicGame() {
    applyCustomQuotes();
    var diff = DIFFS.filter(function (d) { return d.key === selectedDiff; })[0];
    var pool = shuffle(ICONS.slice()).slice(0, diff.pairs);
    var items = pool.map(function (svg) { return { type: 'icon', content: svg }; });
    setupClassic.classList.add('hidden'); setupPhotos.classList.add('hidden');
    buildBoard(items, diff.key);
  }
  document.getElementById('startClassicBtn').addEventListener('click', startClassicGame);

  function revokeActiveRoundURLs() { activeRoundURLs.forEach(function (u) { URL.revokeObjectURL(u); }); activeRoundURLs = []; }

  function startPhotosGame() {
    if (!selectedPackName) return;
    applyCustomQuotes();
    getPhotosForPack(selectedPackName).then(function (records) {
      if (records.length === 0) return;
      var k = Math.min(selectedRoundSize || records.length, records.length);
      var chosen = shuffle(records.slice()).slice(0, k);
      revokeActiveRoundURLs();
      var items = chosen.map(function (r) {
        var url = URL.createObjectURL(r.blob);
        activeRoundURLs.push(url);
        return { type: 'img', content: url };
      });
      setupClassic.classList.add('hidden'); setupPhotos.classList.add('hidden');
      buildBoard(items, null);
    }).catch(function (err) { console.error(err); });
  }
  startPhotosBtn.addEventListener('click', startPhotosGame);

  /* =========================================================
     INITIAL RENDER
  ========================================================= */
  applyStaticTranslations();

})();
</script>
</body>
</html>
